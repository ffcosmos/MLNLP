name: Deploy MLNLP 2025 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mlnlp2025/**'
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the 2025 website
        run: |
          mkdir -p _site
          cp -R mlnlp2025 _site/mlnlp2025
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
